[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_teleop_onero_a1"
version = "0.1.0"
description = "LeRobot teleoperator plugin for OneRobotics A1 robot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Custom" }]
keywords = ["lerobot", "teleoperator", "onero", "a1"]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_teleop_onero_a1"]
